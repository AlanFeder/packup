import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
gradle.projectsEvaluated {
    rootProject.tasks.register('exportSecurityRuntime') {
        doLast {
            def appProject = rootProject.project(':app')
            def components = appProject.configurations.getByName('releaseRuntimeClasspath').incoming.resolutionResult.allComponents
            def packages = components.findAll { it.id instanceof ModuleComponentIdentifier }.collect {
                def id = it.id
                [type:'library', group:id.group, name:id.module, version:id.version,
                 purl:"pkg:maven/${id.group}/${id.module}@${id.version}"]
            }
            new File(System.getProperty('audit.output')).text = JsonOutput.toJson([bomFormat:'CycloneDX',specVersion:'1.5',version:1,components:packages])
            println "Exported ${packages.size()} resolved Maven components"
        }
    }
}
