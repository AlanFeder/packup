# Routine updates: one monthly minor/patch group per ecosystem and directory.
# The allow update-types filter does not apply to security updates.
version: 2
updates:
- package-ecosystem: npm
  directory: /vercel_prototype
  schedule:
    interval: monthly
  open-pull-requests-limit: 1
  allow:
  - dependency-name: '*'
    update-types:
    - version-update:semver-minor
    - version-update:semver-patch
  groups:
    routine-updates:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: gradle
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 1
  allow:
  - dependency-name: '*'
    update-types:
    - version-update:semver-minor
    - version-update:semver-patch
  groups:
    routine-updates:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
